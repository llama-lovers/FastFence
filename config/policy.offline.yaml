version: 1
description: Strict input protection with useful, redacted output
privacy:
  enabled: true
  input: block
  output: redact
signatures_enabled: true
max_input_bytes: 16384
max_output_bytes: 16384
semantic:
  provider: disabled
  model: qwen3:0.6b
  threshold: 0.7
  timeout_ms: 10000
  scan_output: true
tools:
  knowledge.search:
    roles: [analyst, operator]
    timeout_ms: 1000
    cost_microusd: 100
  memory.read:
    roles: [analyst, operator]
    timeout_ms: 1000
    cost_microusd: 100
  report.contact:
    roles: [analyst, operator]
    timeout_ms: 1000
    cost_microusd: 100
  payments.prepare:
    roles: [operator]
    timeout_ms: 1000
    cost_microusd: 500
models:
  qwen3:0.6b:
    roles: [analyst, operator]
    max_output_tokens: 256
    timeout_ms: 30000
    cost_microusd: 0
budgets:
  analyst:
    calls: 20
    tokens: 1000000
    cost_microusd: 10000
    compute_ms: 180000
    concurrent: 4
  operator:
    calls: 30
    tokens: 2000000
    cost_microusd: 20000
    compute_ms: 300000
    concurrent: 4
