name: Documentation

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact tag whose public PyPI installation has passed verification
        required: false
        type: string
      development_sha:
        description: Exact successful main CI commit for unreleased documentation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: documentation-history
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.development_sha || inputs.release_tag }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.10"
          python-version: "3.12"
      - name: Install locked documentation dependencies
        run: uv sync --locked --only-group docs
      - name: Fetch the preserved documentation history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages:gh-pages
          else
            status=$?
            test "$status" = 2
          fi
      - name: Build the verified documentation channel
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEVELOPMENT_SHA: ${{ inputs.development_sha }}
        run: |
          if [ -n "$DEVELOPMENT_SHA" ]; then
            test -z "$RELEASE_TAG"
            uv run --locked --only-group docs python scripts/versioned_docs.py "$DEVELOPMENT_SHA" --dev
          else
            test -n "$RELEASE_TAG"
            uv run --locked --only-group docs python scripts/versioned_docs.py "$RELEASE_TAG"
          fi
      - name: Preserve version history
        run: git push origin gh-pages
      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-versioned

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
