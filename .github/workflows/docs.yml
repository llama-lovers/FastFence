name: Documentation

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact tag whose public PyPI installation has passed verification
        required: false
        type: string
      development_sha:
        description: Exact successful main CI commit for unreleased documentation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: documentation-history
  cancel-in-progress: false
  queue: max

jobs:
  build:
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      pages_sha: ${{ steps.history.outputs.pages_sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.development_sha || inputs.release_tag }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.10"
          python-version: "3.12"
      - name: Install locked documentation dependencies
        run: uv sync --locked --only-group docs
      - name: Fetch the preserved documentation history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages:gh-pages
          else
            status=$?
            test "$status" = 2
          fi
      - name: Build the verified documentation channel
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEVELOPMENT_SHA: ${{ inputs.development_sha }}
        run: |
          if [ -n "$DEVELOPMENT_SHA" ]; then
            test -z "$RELEASE_TAG"
            uv run --locked --only-group docs python scripts/versioned_docs.py "$DEVELOPMENT_SHA" --dev
          else
            test -n "$RELEASE_TAG"
            uv run --locked --only-group docs python scripts/versioned_docs.py "$RELEASE_TAG"
          fi
      - name: Preserve version history
        id: history
        run: |
          git push origin gh-pages
          echo "pages_sha=$(git rev-parse gh-pages)" >> "$GITHUB_OUTPUT"
      - name: Upload static site
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-versioned

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out versioned deployment implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy documentation
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          PAGES_HISTORY_SHA: ${{ needs.build.outputs.pages_sha }}
        run: python3 scripts/deploy_pages.py --artifact-id "$PAGES_ARTIFACT_ID" --pages-sha "$PAGES_HISTORY_SHA"
      - name: Verify the actual public documentation
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEVELOPMENT_SHA: ${{ inputs.development_sha }}
        run: |
          if [ -n "$DEVELOPMENT_SHA" ]; then
            python3 scripts/verify_public_docs.py --development-sha "$DEVELOPMENT_SHA" --output public-docs-verification.json
          else
            python3 scripts/verify_public_docs.py --version "${RELEASE_TAG#v}" --output public-docs-verification.json
          fi
      - name: Retain public documentation verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-documentation-verification
          path: public-docs-verification.json
          if-no-files-found: ignore
          retention-days: 14
