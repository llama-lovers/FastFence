site_name: FastFence
site_description: Fast, local policy enforcement for AI agents, tools and models.
site_url: https://fastfence.dev/
repo_url: https://github.com/llama-lovers/HackYeah2026-challenge-second
repo_name: llama-lovers/FastFence
edit_uri: edit/main/docs/
copyright: Copyright 2026 FastFence contributors · Apache-2.0
strict: true

theme:
  name: material
  language: en
  icon:
    logo: material/shield-check
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - fenced_code
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite

extra_javascript:
  - path: javascripts/mermaid.mjs
    type: module

nav:
  - Overview: index.md
  - Get started: getting-started.md
  - Guides:
      - Policies and controls: policies.md
      - Laya, MCP and models: integrations.md
      - Testing and evidence: testing.md
      - Challenge readiness: challenge-readiness.md
  - Reference:
      - Architecture: architecture.md
      - Runtime settings: settings.md
      - Documentation deployment: deployment.md
