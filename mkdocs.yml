site_name: FastFence
site_description: Fast, local policy enforcement for AI agents, tools and models.
site_url: https://fastfence.dev/
repo_url: https://github.com/llama-lovers/FastFence
repo_name: llama-lovers/FastFence
edit_uri: edit/main/docs/
copyright: Copyright 2026 FastFence contributors · Apache-2.0
strict: true

theme:
  name: material
  language: en
  logo: assets/fastfence-header.svg
  favicon: assets/favicon.png
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
        - locale: pl
          name: Polski
          site_description: Lokalne egzekwowanie polityk bezpieczeństwa dla agentów AI, narzędzi i modeli.
          nav_translations:
            Overview: Wprowadzenie
            Get started: Pierwsze kroki
            Installation: Instalacja
            Learn by task: Nauka przez zadania
            Verify your installation: Sprawdź instalację
            Guides: Przewodniki
            Policies and controls: Polityki i kontrole
            Connect agents and models: Połącz agentów i modele
            Examples: Przykłady
            Custom Python detectors: Własne detektory w Pythonie
            Protected model request: Chronione wywołanie modelu
            Named Laya rule: Nazwana reguła Laya
            MCP client: Klient MCP
            FastMCP server: Serwer FastMCP
            OpenAI SDK client: Klient OpenAI SDK
            OpenAI-compatible upstream: Dostawca zgodny z OpenAI API
            Public/private-key anonymization: Anonimizacja z kluczem publicznym i prywatnym
            Reference: Dokumentacja techniczna
            Integration contracts: Kontrakty integracji
            HTTP API from source: HTTP API
            Runtime settings: Ustawienia
            Architecture: Architektura
            Changelog: Dziennik zmian

hooks:
  - scripts/docs_reference.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: language-mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/branding.css

extra_javascript:
  - path: javascripts/mermaid.mjs
    type: module

nav:
  - Overview: index.md
  - Get started:
      - Installation: getting-started.md
      - Learn by task: learn.md
      - Verify your installation: manual-testing.md
  - Guides:
      - Policies and controls: policies.md
      - Connect agents and models: integrations.md
  - Examples:
      - Agent Communication Protocol: examples/acp.md
      - Custom Python detectors: examples/custom-detectors.md
      - Protected model request: examples/protected-request.md
      - Named Laya rule: examples/semantic-policy.md
      - MCP client: examples/mcp-client.md
      - FastMCP server: examples/fastmcp-server.md
      - OpenAI SDK client: examples/openai-client.md
      - OpenAI-compatible upstream: examples/openai-upstream.md
      - Public/private-key anonymization: examples/asymmetric-anonymization.md
  - Reference:
      - Integration contracts: integration-reference.md
      - HTTP API from source: reference/http-api.md
      - Runtime settings: settings.md
      - Architecture: architecture.md
  - Changelog: https://github.com/llama-lovers/FastFence/releases

extra:
  version:
    provider: mike
    default: latest
    alias: true
