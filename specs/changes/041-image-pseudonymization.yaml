id: FF-041
title: Image and PDF redaction with stateless recovery tokens
status: planned
problem: Confidential text in images must be protected before model processing while optionally preserving authorized restoration and references across text and image content.
scope:
  - Compose the independent OCR module from FF-042 with anonymization and control through a workflow using stateless tokens from FF-043.
  - Consume OCR text and bounding boxes, evaluate central rules over full text spans, and overwrite every affected region in a newly encoded image.
  - Label masked regions with stable opaque keyed identifiers without a conversation mapping.
  - Return complete self-contained authenticated encrypted recovery tokens with reversible document responses, outside vision-model image payloads; no server lookup or conversation context.
  - Include PNG/JPEG and multipage PDF in the first document release; build PDF output exclusively from sanitized page rasters.
  - Support policy-controlled irreversible and reversible modes; irreversible mode retains and exports no inverse map or original crops.
constraints:
  - This is a future feature; OCR, image transport and restoration are not implemented or verified by this specification.
  - A plain hash of sensitive text is neither encryption nor sufficient restoration material; public region identifiers must not expose guessable raw-value hashes.
  - Exact pixel restoration requires encrypted original crops and coordinates bound to the exact image; an OCR string only supports text recovery. Pixel restoration is a proposed later phase pending the user's scope decision.
  - Produce opaque pixel masks rather than removable overlays and strip source metadata from the exported image.
  - Do not copy source PDF text/OCR layers, objects, attachments, forms, scripts or metadata into the fresh raster PDF; document loss of searchability and interactive features.
  - Preserve PDF page order and dimensions, enforce aggregate processing limits and reject the whole document on any page failure.
  - Reuse scoped keyed aliases for equal values across text and pages where policy permits, without numbered conversation counters.
  - Authentication, owner binding, expiry and current restoration permissions remain authoritative.
  - Define image byte and pixel limits, OCR timeout and failure behavior before implementation; uncertain processing must not silently forward the original image.
  - Benchmark OCR and image encoding independently from the deterministic text path; no image latency claims without measurements.
  - Gateway-held keys are the reversible-mode working assumption; requests are independent and parallel without context-update coordination.
  - OCR extracts text and geometry without importing control or anonymization; the workflow calls their public facades and enforces the active policy.
change_paths:
  - src/fastfence/modules/anonymization/**
  - src/fastfence/workflows/**
  - tests/integration/test_image_anonymization.py
acceptance:
  - Supported image fixtures have all expected sensitive regions masked and labelled while preserving non-sensitive layout.
  - The upstream model receives only the sanitized image, never the original image or restoration material.
  - Later pixel restoration requires complete crop tokens and refuses mismatched artifacts, modified tokens and other owners; region labels alone cannot restore crops.
  - OCR misses, low confidence, limits and failure behavior have explicit tests and documented coverage limitations.
  - Multipage scanned and digitally generated PDF fixtures produce sanitized output with no recoverable source text layer or embedded original objects.
  - Irreversible processing produces no recovery material and rejects restore requests; reversible mode still requires explicit restoration consent.
validation:
  - command: uv run pytest --no-cov tests/integration/test_image_anonymization.py
    expected: Future tests demonstrate masking, content isolation and authorized restoration; this command is not yet runnable.
evidence: []
