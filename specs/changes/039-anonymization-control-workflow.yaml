acceptance:
- Real protected calls send aliases upstream and retain stable scoped aliases across independent calls and output.
- Restore is false by default and is denied when ownership, active rules or privacy BLOCK controls do not permit
  it.
- HTTP, MCP and OpenAI-compatible calls expose transformation flags without conversation identifiers or original-value
  maps.
- Original attacks and forbidden replacement/restored content cannot bypass controls through anonymization.
- Preview results match local enforcement while keeping preview data outside live conversation state.
- A preserved authenticated token is checked against final replacement restrictions even when it produces no new
  findings.
validation:
- command: uv run pytest -q --no-cov tests/integration/test_stateless_control.py
  expected: Cross-module pipeline, ownership, restoration, privacy precedence and transport regressions pass.
- command: uv run lint-imports
  expected: Modules remain independent under all architecture contracts.
- command: uv run pre-commit run --all-files
  expected: Quality, typing, architecture and specification gates pass.
evidence:
- command: Actual local ASGI gateway + stateless keyring + demo tool + PaddleOCR two-page PDF
  result: Default response contains opaque token; opt-in restores original; audit stores neither; PDF yields two
    redacted pages without upstream execution
  report: evaluation/results/stateless-document-smoke.json
- command: Actual local Qwen3:0.6b through FastFence, plus real OCR PNG to model
  result: Default response withheld original; opt-in restored exact original from copied token. Real OCR Markdown
    reached Qwen through controls. Synthetic smoke only.
  report: evaluation/results/live-anonymization-document.json
