id: FF-039
title: Compose stateless anonymization and control through a protected workflow
status: implemented
problem: The independent anonymization module must protect real HTTP, MCP and model traffic while preserving existing
  policy precedence, tenant isolation, budgets and audit.
scope:
- Add a control-side anonymization port and a workflow adapter to the independent module facade.
- Extend central policy with typed anonymization configuration and calls with restore_originals metadata without
  conversation state.
- Apply transformations to model content and tool values on both input and output, never protocol metadata or structural
  keys.
- Keep aliases toward upstream models/tools; optional restoration occurs only at the caller-facing output boundary.
- Preview proposals through an stateless synthetic identity scope without any original-value dictionary.
constraints:
- Feature modules cannot import one another; app/workflows compose public facades through shared Pydantic contracts.
- Original text/signature and explicit privacy BLOCK decisions remain authoritative before transformation.
- Alias replacements and restored output undergo final size, text/signature and privacy BLOCK checks.
- Existing redaction applies to unmatched sensitive content; restoration reveals only active-rule-approved aliases
  in the same verified owner scope.
- No original-value dictionary or payload bodies in audit, errors or management status.
- Disabled/empty anonymization preserves the existing fast path without extra semantic calls or conversation state
  allocation.
- Preserve budget settlement, snapshot consistency and upstream_executed semantics.
