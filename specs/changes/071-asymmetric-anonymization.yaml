acceptance:
- FFR2 round-trips through independent instances with the same trusted keys while equal values retain stable scoped IDs and
  randomized ciphertext.
- Tampering, wrong issuer/recipient, altered tenant/subject/rule, expiration and missing keys fail closed.
- An invalid envelope MAC never reaches RSA decryption.
- FFR1 remains readable with an RSA pair configured and irreversible behavior remains unchanged.
- REST responses keep originals hidden by default and restore only with permission plus request opt-in; reinspection prevents
  encoded-token bypass.
- Key generation never overwrites existing files and private files have mode 0600.
validation:
- command: uv run pytest --no-cov tests/unit/test_asymmetric_anonymization.py tests/integration/test_asymmetric_anonymization.py
    tests/unit/test_anonymization_tokens.py
  expected: Cryptographic, statelessness, compatibility, provisioning and REST security regressions pass.
evidence:
- result: 76 tests passed across new asymmetric unit/REST tests and existing core/legacy token tests; 27 additional key-file,
    operations, reinspection and UI regressions passed (103 total).
- result: basedpyright reported zero errors, warnings or notes; all 16 import contracts and architecture AST checks passed.
- result: Ruff lint/format and pyscn complexity, dead-code and dependency checks passed.
- result: Strict MkDocs build passed with public/private-key setup, exact embedded key-generator source and LLM corpus inclusion.
- result: evaluation/results/asymmetric-crypto.json records 100 samples per mode and payload size using preloaded keys, excluding
    key generation and gateway/model work.
- result: FFR2 16-byte issue-plus-verify measured mean 1.276 ms and p95 1.283 ms; 4096-byte payload remained within the default
    8192-byte token limit.
