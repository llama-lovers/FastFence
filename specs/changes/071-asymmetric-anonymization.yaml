id: FF-071
title: Stateless public-key envelope encryption for reversible anonymization
status: implemented
problem: Reversible tokens currently use a symmetric keyring; the requested public/private-key recovery mode is not implemented.
scope:
- Add FFR2 tokens using RSA-3072 OAEP-SHA256 public-key wrapping of a fresh AES-256-GCM content key.
- Authenticate the complete envelope and scoped token header with a separate issuer key derived from the existing keyring
  before private-key decryption.
- Load a matching trusted public/private PEM pair once at startup; preserve FFR1 and irreversible compatibility.
- Provide exclusive private-permission key generation and a complete documented setup example.
constraints:
- Use cryptography library primitives, Pydantic contracts and existing authenticated tenant/subject/rule/expiry semantics.
- No conversation database, plaintext map, request-path file reads or network calls.
- Both key files and the issuer keyring are required for a full gateway because security reinspection decrypts tokens internally.
- Public-key possession alone must not permit forging an accepted token.
- Restoration still requires explicit request opt-in and active rule permission; invalid tokens fail closed without content
  leakage.
