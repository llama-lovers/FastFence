id: FF-042
title: Independent local OCR module producing ordered document text
status: verified
problem: The document-to-Markdown workflow needs local extraction of text from images and every PDF page without coupling
  providers to security policy or media editing.
scope:
- Create modules/ocr with extraction domain models, provider ports, persistence adapters and a public application facade.
- Define shared Pydantic results containing page identifiers, ordered text blocks, confidence and optional geometry needed
  to establish reading order.
- Start provider evaluation with PaddleOCR and pretrained Polish/English-capable models; verify actual quality, deployment
  and code/model licenses.
- Decode bounded PNG/JPEG images and locally render multipage scanned, digital and mixed PDFs from the first release.
- Compose extraction through workflows/document_markdown without direct imports between feature modules.
constraints:
- No image/PDF editing or pixel restoration; geometry supports reading order and diagnostics, not a masking API.
- No OCR execution or heavyweight OCR imports on the ordinary text-only request path.
- Apply byte, page-count, per-page and aggregate pixel, render/OCR timeout and concurrency limits; run blocking work outside
  the event loop.
- Reject encrypted or unsupported PDFs explicitly at first; a required page failure rejects the whole document, not a silently
  truncated result.
- OCR only extracts content; central text policy controls the resulting Markdown before export or upstream use.
- Preserve multiword and multiline text so policy checks do not depend on isolated OCR words; page order and separators must
  be explicit.
- Do not fetch external resources, interpret document text as instructions or copy embedded source media into model inputs.
- Confidence does not prove completeness; evaluate OCR omissions and incorrect recognition, especially sensitive identifiers
  and Polish characters.
- No original document or raw OCR content in logs, audit or management status; no persistent conversation state.
- OCR confidence and five clean synthetic fixtures do not establish production completeness or sensitive-identifier recall.
- Workers load models per request; reported times include process initialization and do not represent a persistent warm model.
change_paths:
- src/fastfence/modules/ocr/**
- src/fastfence/shared/ocr.py
- src/fastfence/workflows/document_markdown.py
- tests/unit/test_ocr*.py
- tests/integration/test_ocr*.py
- examples/documents/**
- evaluation/results/ocr-local.json
acceptance:
- Synthetic Polish and English fixtures produce expected text and page order after orientation normalization.
- Multiword, multiline, rotated and mixed multipage PDF fixtures exercise reading order and document-wide limits.
- Corrupt, unsupported, oversized and timed-out inputs fail without forwarding original media or partial results as complete.
- Architecture checks prevent direct imports between OCR, anonymization and control modules.
- Report OCR omissions and identifier-recognition quality together with cold/warm p50/p95; do not claim production speed from
  an unrelated benchmark.
validation:
- command: uv run pytest --no-cov tests/unit/test_ocr.py tests/unit/test_ocr_media.py
  expected: Bounded validation, killable worker timeout/output, page/pixel/media failure checks pass.
- command: env PYTHONPATH=src state/private/ocr-env/bin/python -m fastfence.modules.ocr.interfaces.smoke --python state/private/ocr-env/bin/python
    --models state/private/ocr-models --repeats 1
  expected: Actual PaddleOCR processes PNG, JPEG, rotated PNG, scanned two-page PDF and mixed digital/scanned PDF locally;
    ordered expected synthetic strings pass.
- command: uv run lint-imports
  expected: All sixteen architecture contracts pass, including no direct OCR/control/anonymization dependencies.
evidence:
- command: Actual PaddleOCR 3.4.0 / PaddlePaddle 3.3.0 Apple Silicon smoke
  result: Five fixtures passed 22 expected-text/page-order checks. Polish diacritics, synthetic email and 11-digit identifier
    were recognized; all required pages processed. Report evaluation/results/ocr-local.json includes fixture hashes and descriptive
    fresh-worker wall times.
- command: Provider deployment and license review
  result: macOS arm64 Python 3.12 wheels installed. Fixed document-orientation/mobile-detection/Latin-recognition weights
    total approximately 19.3 MiB. All three downloaded official model cards declare Apache-2.0, matching PaddleOCR/PaddlePaddle
    code licensing. Request workers disable outbound connections and require preloaded fixed local model directories.
- command: Focused unit/integration, type and architecture checks
  result: Nineteen core tests plus eight isolated real decoder tests passed; BasedPyright zero diagnostics and all sixteen
    import contracts kept. Tests distinguish simulated OCR fixtures from actual extraction report.
