id: FF-011
title: Offline detect-secrets guardrail and repository hook
status: verified
problem: The existing secret heuristics cover only a small set of credential formats; the project also
  lacks the requested detect-secrets repository gate.
scope:
- Add pinned public detect-secrets dependency and offline runtime adapter for input/output privacy enforcement.
- Preserve protocol-independent core with a typed port and explicit runtime composition.
- Add pre-commit secret scanning with reviewed synthetic-only baseline.
- Verify additional credential detection, redaction, concurrent execution, sanitized audit and no request-path
  I/O.
- Measure the new deterministic runtime separately from previous benchmark evidence.
constraints:
- No credential verification network calls or filesystem scanning in runtime.
- Initialize detector instances once; do not mutate global detect-secrets settings per request.
- Runtime must ignore repository baselines and allowlist comments supplied by callers.
- Pydantic-only first-party records; no generic NL-policy authoring feature is claimed by this integration.
- Baseline exceptions must be reviewed known synthetic values, not blanket source/test exclusions.
change_paths:
- pyproject.toml
- uv.lock
- .pre-commit-config.yaml
- .secrets.baseline
- src/fastfence/modules/control/**
- tests/**
- evaluation/**
- README.md
acceptance:
- Real non-network detect-secrets detectors catch credential formats beyond existing regexes.
- Input blocking precedes upstream execution; output redaction/blocking follows active privacy policy.
- Secrets and scanner errors never expose secret values in findings/audit.
- Untrusted allowlist comments and repository baseline cannot bypass runtime checks.
- Configured runtime performs no extra filesystem/network I/O during deterministic scanning.
- Repository hook rejects a new synthetic test credential outside the reviewed baseline.
- All configured quality gates and 85 percent coverage threshold pass.
validation:
- command: uv run pytest -q
  expected: New detector security regressions and all prior controls pass.
- command: uv run pre-commit run --all-files
  expected: Repository scanning and all existing gates pass.
- command: uv run python evaluation/benchmark_gateway.py --output evaluation/results/detect-secrets-runtime-benchmark.json
  expected: Benchmark includes the composed detector and explicitly labeled fixture/model scope.
evidence:
- command: uv run pytest -q
  result: 174 tests passed with 93.96 percent coverage, including format detection, policy actions, no-I/O/concurrency, bypass attempts,
    detector errors and post-redaction size limits
- command: detect-secrets-hook --no-verify --baseline .secrets.baseline
  result: Reviewed synthetic baseline accepted; fresh unbaselined synthetic credential rejected; benign
    control accepted
- command: uv run python evaluation/benchmark_gateway.py --output evaluation/results/detect-secrets-runtime-benchmark.json
  result: 24000 timed calls; allowed zero-wait fixture serial p95 0.141625 ms and 7530.61 calls per second; HTTP and model inference excluded
