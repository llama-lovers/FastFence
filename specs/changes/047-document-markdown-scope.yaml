  - Keep PNG/JPEG and multipage PDF input, stateless modes and authorized text recovery.
  - Remove planned media editing, sanitized PDF output, crop storage and pixel restoration.
constraints:
  - This commit updates the plan only; no OCR runtime or working file-conversion claim.
  - Original media and raw OCR must not be sent upstream; the exported Markdown must also pass text controls.
  - Do not change incomplete runtime work during this documentation update.
change_paths:
