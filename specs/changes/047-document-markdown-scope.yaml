acceptance:
  - Documentation describes local OCR, ordered Markdown, text controls, model substitution and text-only output recovery.
  - No remaining active-plan requirement promises image/PDF editing or pixel restoration.
  - Strict documentation build and applicable specification/hooks checks pass.
validation:
