    result: Updated OCR-to-Markdown plan builds; document editing and pixel recovery are explicitly excluded. This is documentation evidence only.
  - command: uv run python scripts/check_specs.py
    result: All 49 specifications validate with document substitution and text-only recovery as the current planned scope.
