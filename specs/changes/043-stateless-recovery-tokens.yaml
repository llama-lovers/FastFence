id: FF-043
title: Stateless self-contained recovery tokens without conversation context
status: implemented
problem: The user requires independent parallel calls without any conversation store or mapping capsule while optionally
  recovering protected values.
scope:
- Supersede the mapping-capsule proposal with self-contained authenticated encrypted tokens carrying each recoverable
  value.
- Issue stable opaque keyed aliases scoped to verified tenant, subject, rule and entity type without counters or
  conversation state.
- Separate irreversible masking with no recovery material from reversible tokens with optional authorized output
  restoration.
- Select a reviewed cryptographic construction and key provisioning/rotation contract; gateway-held decryption keys
  are the working assumption.
- Integrate stateless token validation and current-policy recovery into input and output workflows.
constraints:
- No database, conversation ID, alias registry, inverse-map vault, mapping capsule, session affinity or per-conversation
  queue.
- Static keys and policy plus temporary request-local buffers are allowed; recovery must not depend on a previous
  request.
- Public-key encryption alone does not authenticate token issuance; authenticate issuer, owner and purpose with
  the selected construction.
- Use separate keys for identifiers and encryption; never reuse an AEAD nonce with the same key or derive reusable
  nonces from original values.
- Irreversible mode retains or exports no originals, crops or recovery payloads and rejects restoration; restore=false
  alone does not make reversible mode irreversible.
- Restoration requires the complete unmodified token; short aliases, missing tokens or model paraphrases must not
  trigger guessed replacements.
- Stable identifiers reveal equality within their scope; no plain hashes of guessable personal data or correlation
  across owners.
- Bound token parsing and decoded sizes; never log original values, private keys or recovery tokens.
- No single-use, latest-version or individual immediate-revocation claims for stateless tokens; validate expiry
  and current policy/key permission.
- Benchmark crypto and upstream token/transport overhead before making speed claims.
- Client-only decryption is a separate optional architecture, not implied by reversible mode.
change_paths:
- src/fastfence/modules/anonymization/**
- src/fastfence/shared/anonymization.py
- src/fastfence/workflows/**
- tests/unit/test_stateless_tokens.py
- tests/unit/test_anonymization*.py
- tests/integration/test_stateless_tokens.py
- tests/integration/test_stateless_control.py
- evaluation/results/stateless-token-benchmark.json
- evaluation/results/live-anonymization-document.json
acceptance:
- Valid tokens recover after restart with identical configured keys without previous requests, lookup state or conversation
  metadata.
- Parallel independent calls require no coordination or numbered-alias allocation.
- Tampering, owner mismatch, expiry, unsupported versions and oversized tokens fail closed.
- Changed or removed rules and revoked restoration permission prevent unauthorized recovery.
- Irreversible mode returns and retains no recovery material; a caller restore flag cannot upgrade the policy mode.
- Real-model checks distinguish exact-token round trips from modified, missing or alias-only responses.
validation:
- command: uv run pytest -q --no-cov tests/unit/test_anonymization.py tests/unit/test_anonymization_tokens.py tests/integration/test_stateless_control.py
  expected: Stateless matching, authenticated owner/rule binding, expiry, rotation, restart, parallel requests and
    mocked control integration regressions pass.
evidence:
- command: uv run pytest -q --no-cov tests/unit/test_anonymization.py tests/unit/test_anonymization_tokens.py tests/integration/test_stateless_control.py
  result: '60 cases pass: 48 module/crypto cases and 12 REST/native-chat/OpenAI/MCP control integration cases; upstream
    is explicitly a local echo test double, with no live-model inference.'
- command: uv run basedpyright src
  result: Zero errors, warnings or notes.
- command: uv run lint-imports
  result: All sixteen architecture contracts kept.
- command: Ruff owned files and pyscn anonymization module
  result: Lint/format and module complexity gates pass.
- artifact: evaluation/results/stateless-token-benchmark.json
  result: Apple M3 Pro, CPython 3.12, concurrency 1, 100 warmups and 1000 samples per scalar workload. Reversible
    name transform p95 0.018375ms, restore p95 0.017791ms; email transform p95 0.018125ms, restore p95 0.017709ms.
    All 2000 measured round trips are exact. Static configuration/HKDF/startup and HTTP/MCP/model latency excluded.
    Recovery-token bytes are 135 vs 13 for name and 132 vs 16 for email; these are UTF-8 lengths, not tokenizer
    measurements.
- command: Actual local Qwen3:0.6b through FastFence, plus real OCR PNG to model
  result: Default response withheld original; opt-in restored exact original from copied token. Real OCR Markdown
    reached Qwen through controls. Synthetic smoke only.
  report: evaluation/results/live-anonymization-document.json
