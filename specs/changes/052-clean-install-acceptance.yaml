id: FF-052
title: Test the complete documented local installation from a fresh clone
status: implemented
problem: The manual assumed private development state and omitted initialization and feature prerequisites, so the advertised clean-start sequence failed.
scope:
  - Make README, getting-started and manual instructions ordered and self-contained.
  - Clone the committed repository into an empty directory and install locked dependencies without inherited FastFence environment settings.
  - Verify missing-state diagnostics, idempotent initialization, generated keys, HTTP authentication, protection and optional restoration.
  - Offer a full acceptance mode that installs Laya and OCR, checks Qwen and executes the documented real-model and document paths.
  - Require offline clean-clone acceptance in GitHub Actions before documentation deployment.
constraints:
  - Do not copy existing state, .env, .venv or credentials into the fresh clone.
  - No model downloads or external model service required by the ordinary CI clean-start check.
  - Preserve the user's existing checkout and private configuration.
  - Full local acceptance may reuse public dependency and model download caches, but must create new credentials, keys and feature installations.
change_paths:
  - scripts/smoke_clean_install.py
  - .github/workflows/ci.yml
  - README.md
  - docs/manual-testing.md
  - docs/getting-started.md
  - docs/testing.md
  - evaluation/results/clean-install-*.json
  - .secrets.baseline
acceptance:
  - The documented startup command sequence works from a fresh clone with no previous private state.
  - A serve attempt before initialization gives an actionable error without traceback.
  - Repeated init preserves credential and key file bytes exactly.
  - Full feature acceptance generates and tests a real Laya rule and processes a two-page PDF through the installed local OCR.
validation:
  - command: uv run python scripts/smoke_clean_install.py
    expected: Fresh-clone offline acceptance passes.
  - command: uv run python scripts/smoke_clean_install.py --full
    expected: Fresh-clone full feature acceptance passes with local Ollama available.
evidence:
  - command: Fresh-clone core acceptance at fc4cddc36718d07fccd27a40f02cef44a1bcc71f
    result: All ten checks passed without inherited private state, including repeat initialization, HTTP protection, stateless restoration and actual MCP flags. Sanitized report evaluation/results/clean-install-core.json.
  - command: Fresh clone, uv sync --locked, uv run fastfence init --anonymization, sh scripts/setup-ocr.sh, then actual OCR smoke
    result: New locked OCR environment and model directory initialized without .env; automatic settings discovery passed. Five synthetic image/PDF fixtures passed all 22 text/page checks. Fresh-worker p50 5557 ms and p95 5777 ms are local single-repeat observations, not a production SLA. Report evaluation/results/clean-install-ocr.json records versions and hashes.
  - command: Document route through FastAPI TestClient with actual OCR in the fresh checkout
    result: Default privacy block returned 422 without Markdown; privacy redact returned 200 with two ordered pages and the synthetic email removed. This in-process transport check invoked no LLM.
  - command: Full fresh-clone Laya and model acceptance
    result: Not established by the core and OCR reports; retain implemented status until a complete --full run succeeds.
