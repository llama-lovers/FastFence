id: FF-079
title: Extend offline privacy controls with trusted Python text detectors
status: implemented
problem: Operators need to define custom literal and regex text rules using Python detect-secrets plugins without modifying FastFence source.
scope:
  - Select local Python plugin files through explicit trusted startup settings.
  - Bound file count, source bytes, detector count, regex configuration and yielded candidate count.
  - Cache source loading across preflight and runtime construction; preserve built-in detectors.
  - Apply the existing input and output block or redact privacy actions to custom matches.
  - Provide a package-first downloadable Python example and complete configuration instructions.
constraints:
  - Never load executable plugins through policy JSON, remote configuration or HTTP input.
  - Never call online secret verification; no request-time plugin source reads.
  - Invalid plugin configuration stops startup and runtime detector failures fail closed with static reasons.
  - Every regex detector candidate must map to a nonempty full-match span; zero-width or uncovered results fail closed.
  - Plugins are trusted arbitrary Python, not a sandbox or hard-timeout execution environment.
change_paths:
  - src/fastfence/modules/control/persistence/secret_plugins.py
  - src/fastfence/modules/control/persistence/secrets.py
  - src/fastfence/modules/control/application/facade.py
  - src/fastfence/shared/settings/app_settings.py
  - tests/unit/test_custom_secret_plugins.py
  - tests/unit/test_documentation_downloads.py
  - examples/docs/custom_detector.py
  - docs/examples/custom-detectors.md
  - scripts/docs_reference.py
  - scripts/check_architecture.py
  - tests/unit/test_architecture_gate.py
  - mkdocs.yml
  - docs/settings.md
  - .env.example
acceptance:
  - Both BasePlugin and RegexBasedDetector custom classes match nested values without removing built-in protection.
  - Missing, oversized, duplicate, malformed and invalid plugins stop startup with content-free errors.
  - Input and output each support block and redact; runtime failures never return uninspected content.
  - Downloaded examples and published navigation include the custom detector guide and source.
validation:
  - command: uv run pytest --no-cov -q tests/unit/test_custom_secret_plugins.py tests/unit/test_secret_detector.py tests/unit/test_secret_redaction_bounds.py
    expected: Custom extension and existing detector behavior checks pass.
  - command: uv run mkdocs build --strict
    expected: Example downloads, navigation and embedded source render successfully.
evidence:
  - check: Focused custom plugin, built-in detector, redaction-boundary, download and architecture tests
    result: 44 tests passed, including full engine input blocking, output nested redaction and absence of raw matches from audit records.
  - check: Static checks and published documentation
    result: Full src basedpyright zero errors; all 16 import contracts kept; pyscn passed; strict MkDocs build passed with downloaded example and embedded source.
  - check: Independent review found regex candidates without usable full-match spans
    result: Fixed silent pass-through by requiring candidate coverage with nonempty spans; input and output regressions cover contextual zero-width captures and custom unmatched candidates.
  - check: Independent review found noncallable plugin methods leaked a literal through startup validation
    result: Validate analyze_string callable inside the sanitized startup boundary; malformed method regression asserts static content-free error.
  - check: Independent manual installed-wheel HTTP validation
    result: Fresh 0.1.2 wheel installed outside checkout without PYTHONPATH; example self-check and doctor passed; three custom regex, literal and BasePlugin requests were blocked before model execution with expected findings and no raw matched values in audit.
