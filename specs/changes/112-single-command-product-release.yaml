id: FF-112
title: Release the single-command launcher as FastFence 1.0.2
status: implemented
problem: The published package requires separate init and serve commands rather than the requested single invocation.
scope:
  - Publish automatic first and repeat startup under a new immutable patch version.
constraints:
  - Do not modify the existing 1.0.1 tag or distribution.
  - Require source and installed-wheel checks before creating the release tag.
change_paths:
  - _version.py
acceptance:
  - The built package reports version 1.0.2 and its default invocation launches the local product.
validation:
  - command: uv run pytest -q
    expected: The complete regression suite passes.
  - command: uv build
    expected: Version 1.0.2 wheel and source distributions build successfully.
evidence:
  - check: Public release 1.0.2
    result: GitHub Actions run 37163868257 passed build, tests, quality gates, PyPI publication, exact public distribution verification, ACP peers, uv tool invocation, public documentation verification and release notes. An independent local fresh-cache public-package startup test also passed with actual Laya and OCR.
  - command: uv run --no-project python scripts/verify_public_docs.py --version 1.0.2 --timeout 15 --output state/private/public-docs-1.0.2.json
    result: Verified public English and Polish 1.0.2 pages and latest aliases. Latest stable is 1.0.2.
  - check: Candidate distribution acceptance
    result: Built version 1.0.2 wheel and sdist. Installed candidate completed automatic initialization and repeat launch in a fresh external directory with actual Laya and OCR, without explicit init or serve commands. Public-package verification follows publication.
